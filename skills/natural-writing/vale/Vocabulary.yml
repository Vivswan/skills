# Word-level AI tells from the /natural-writing skill's "AI vocabulary" and "copula avoidance" lists
# (references/words-to-avoid.md), minus words the upstream /unslop skill's Vale rules already flag,
# so running both styles reports each hit once.
# Left out, each for a literal use in a code repository: underscore and underscores (the character), features
# (a product's), key (a map's), valuable, highlight (an editor's), landscape (a page's), represents a, refers to,
# offers a, maintains a, and the Grok-era research words causal, correlate, empirical.
extends: existence
message: "'%s' is an AI tell. Say it with the plain word"
level: error
ignorecase: true
tokens:
  - align with
  - bolstered
  - deep dive
  - emphasizing
  - enhancing
  - highlighting
  - intricacies
  - meticulous
  - meticulously
  - robust
  - showcasing
  - functions as a
  - operates as a
  - holds the distinction of
