# Repo-owned CI checks, called by the managed ci.yml inside the all-green
# gate: every job here must pass before all-green goes green. Seeded once
# by the fleet sync and never overwritten, so edit freely: multiple jobs,
# matrices, and further local reusable workflows all work.
#
# Two limits from running inside the `checks` caller: jobs here get no
# secrets and are capped at the caller's permissions (contents: read), and
# all-green only sees the aggregate result, so a job skipped by its own
# `if:` does not fail the gate. A check that needs secrets, more
# permissions, or must never be skippable, belongs in its own workflow wired
# into the ruleset via .github/settings.yml.

name: Checks

on:
  workflow_call:

jobs:
  # Typecheck, Biome lint, structural validation, and cross-file consistency
  # checks (see the "check" script in package.json). uv provides the uvx
  # runner behind lint:yaml and lint:json.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: bun install --frozen-lockfile
      - run: bun run check

  # End-to-end: the real `npx skills` CLI must discover and group the skills
  # exactly as consumers see them. Needs network; no install step because
  # scripts/lib.ts is dependency-free.
  cli-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun scripts/cli-discovery-test.ts

  # The validate-skills composite action lives here and repo-platform's own
  # ci.yml calls it on its skills directory, so it also runs on this checkout:
  # a regression in the action fails this repository first.
  validate-skills-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/validate-skills
        with:
          mode: structure
