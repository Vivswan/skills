# Nightly CI starter: written once by Vivswan/repo-platform, never
# overwritten by a later sync. The report job files one label-deduplicated
# tracking issue on a red night and closes it on a green one
# (repo-platform's docs/nightly.md).
#
# The one nightly check here is the xeno refresh: it rewrites the vendored
# copies under xeno/ from their upstreams and opens (or updates) one pull
# request when a pin moved. The copies and xeno/sources.yml are written only
# by scripts/sync-xeno.mts; a hand edit there fails the sync's own --check.
#
# The push and the PR use GITHUB_TOKEN, and events raised by that token start
# no workflow runs, so the PR arrives without CI. The gate below runs the
# repository's full check on the refreshed tree first, and the PR body says
# so; an empty commit pushed by a human, or a close-and-reopen, gives it a CI
# run. A PAT in an environment would remove that step.
name: Nightly

on:
  schedule:
    # Offset from the fleet's other nightlies (ci.yml 04:03, the starter's
    # 06:59) so they do not all land at once.
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly

permissions:
  contents: read

jobs:
  sync-xeno:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: chore/sync-xeno-skills
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: bun install --frozen-lockfile

      - name: Refresh the copies
        run: bun scripts/sync-xeno.mts --report "$RUNNER_TEMP/report.md"

      - name: Anything to land?
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "every copy is current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      # The PR gets no CI run of its own (see the header), so the gate runs here on the refreshed tree.
      - name: Gate the refreshed tree
        if: steps.changes.outputs.changed == 'true'
        run: bun run check

      - name: Push the branch and open or update the PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Vivswan Shah"
          git config user.email "58091053+Vivswan@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git add -f xeno   # an upstream file a .gitignore rule matches (dist/, for one) still ships in the copy
          git commit -m "chore(xeno): sync vendored skills to their upstream heads"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          {
            echo "## What this refreshes"
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "## Proof"
            echo
            run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- **Gate:** \`bun run check\` green on this tree inside the sync run ($run_url)."
            echo "- **CI on this PR:** none until a human pushes an empty commit or closes and reopens it;"
            echo "  a push by the workflow token starts no runs."
          } > "$RUNNER_TEMP/body.md"
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/body.md"
            echo "updated PR #$existing"
          else
            gh pr create --draft --base "${GITHUB_REF_NAME:-main}" --head "$BRANCH" \
              --title "chore(xeno): sync vendored skills to their upstream heads" \
              --body-file "$RUNNER_TEMP/body.md"
          fi

  # A CANCELLED sync job counts as red: hitting the timeout cancels
  # rather than fails, and a hang is exactly what a nightly exists to
  # catch. Add sibling jobs freely: list each in `needs` and fold its
  # result into the red/green conditions below.
  report:
    needs: [sync-xeno]
    if: always()
    runs-on: ubuntu-latest
    # A hung reporter is the residual silence window; keep this tight.
    timeout-minutes: 5
    # issues: write is for the fuzz-issue action; an issue it creates fires no issues:opened event, so it assigns the owner itself.
    permissions:
      issues: write
    steps:
      - name: File or update the nightly issue
        if: needs.sync-xeno.result == 'failure' || needs.sync-xeno.result == 'cancelled'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: "nightly-failure"
          title: Nightly CI failures
          label-color: "D93F0B"
          label-description: "Automated nightly CI failure"
          stream: generic

      - name: Close the nightly issue on a green night
        if: needs.sync-xeno.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: "nightly-failure"
          stream: generic
