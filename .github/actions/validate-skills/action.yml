# Vivswan/skills' validator for a repository hosting agent skills. Its callers: this repository's
# checks.yml on this checkout, and repo-platform's own ci.yml on repo-platform's skills/ directory.
# Contract: docs/validate-skills.md.

name: Validate Skills
description: |
  Validates a repository hosting agent skills: its plugin manifests and its skill folders (Vivswan/skills' validator).

  Two modes, chosen by the `mode` input:
    - structure: offline. The plugin manifests parse and name real skill folders, and every folder under the skills
      directory satisfies the SKILL.md frontmatter contract.
    - discovery: runs the real skills CLI at a pinned version against the checkout and asserts every published skill
      appears in its listing. It downloads the CLI with npx, so give it its own job with network.

  An empty skills catalog passes both modes.

  The caller needs no bun step and no install step: the action sets up bun from its own repository's pin. What each
  mode checks, line by line, is docs/validate-skills.md.

inputs:
  skills-dir:
    description: Directory holding the repository's agent skills, relative to the repo root.
    required: false
    default: skills
  plugin-manifest:
    description: Path of the plugin manifest listing the published skills.
    required: false
    default: .claude-plugin/plugin.json
  mode:
    description: structure for the offline manifest and skill-folder checks, or discovery for the skills CLI listing.
    required: false
    default: structure

runs:
  using: composite
  steps:
    # The shared action walks up from this action's folder to the nearest .bun-version, this
    # repository's root pin, so the step reads the right pin from any caller's checkout.
    - name: Set up bun from this repository's pin
      id: bun
      uses: Vivswan/repo-platform/actions/bun-setup@stable
      with:
        from: ${{ github.action_path }}

    - name: Validate skills
      shell: bash
      env:
        SKILLS_DIR: ${{ inputs.skills-dir }}
        PLUGIN_MANIFEST: ${{ inputs.plugin-manifest }}
        MODE: ${{ inputs.mode }}
      run: '"${{ steps.bun.outputs.path }}" "${{ github.action_path }}/validate_skills.ts"'
