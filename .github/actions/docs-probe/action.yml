# Vivswan/skills' docs probe as a composite action: the docs-discipline skill's paragraph cap and
# path check, run at a pinned sha instead of a vendored copy. Its callers: this repository's
# checks.yml on its own pages, and repo-platform's ci.yml on its README and docs. Contract:
# docs/docs-probe.md.

name: Docs Probe
description: >-
  Runs the docs-discipline skill's probe over documentation pages: a paragraph
  or list item over the word cap, and a named repository path or relative link
  that does not exist. Exit 0 clean, 1 findings (one line each, page:line:
  message), 2 usage, a pattern matching nothing, or an unreadable page.

inputs:
  pages:
    description: Whitespace-separated page paths or globs, relative to root; each must match at least one file
    required: true
  bases:
    description: Whitespace-separated directories under root that named paths also resolve against (a tree shipped into other repositories)
    required: false
    default: ""
  root:
    description: The repository root paths resolve against
    required: false
    default: "."
  max-words:
    description: The cap on a paragraph or list item
    required: false
    default: "70"
  shape-only:
    description: "\"true\" skips the path check, for pages that describe another repository's files"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The action pins its own bun: the caller's checkout may carry any
    # .bun-version or none at all.
    - name: Set up the action's bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ github.action_path }}/.bun-version

    - name: Probe the pages
      shell: bash
      env:
        PAGES: ${{ inputs.pages }}
        BASES: ${{ inputs.bases }}
        ROOT: ${{ inputs.root }}
        MAX_WORDS: ${{ inputs.max-words }}
        SHAPE_ONLY: ${{ inputs.shape-only }}
      run: bun "${{ github.action_path }}/run.mts"
